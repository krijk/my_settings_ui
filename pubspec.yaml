version: 0.2.0
homepage: https://github.com/yako-dev/flutter-settings-ui
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  cupertino_ui: any
  flutter:
